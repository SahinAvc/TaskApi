<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İstatistikler — TaskApi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="stats">

    <aside class="sidebar" aria-label="Ana menü">
        <div class="logo">Task<span>Api</span></div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-link" data-nav="tasks"><span aria-hidden="true">▦</span> Görevler</a>
            <a href="calendar.html" class="nav-link" data-nav="calendar"><span aria-hidden="true">◷</span> Takvim</a>
            <a href="stats.html" class="nav-link" data-nav="stats"><span aria-hidden="true">▥</span> İstatistikler</a>
            <a href="settings.html" class="nav-link" data-nav="settings"><span aria-hidden="true">⚙</span> Ayarlar</a>
        </nav>
        <div class="sidebar-bottom">
            <a href="#" class="nav-link logout" id="logout-btn"><span aria-hidden="true">↪</span> Çıkış Yap</a>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div>
                <p id="welcome-message" class="welcome-line">Hoş geldin 👋</p>
                <h1>İstatistikler</h1>
            </div>
            <div class="topbar-actions">
                <button type="button" class="mobile-logout-btn" id="mobile-logout-btn">Çıkış</button>
            </div>
        </header>

        <div id="stats-status" class="page-status" aria-live="polite"></div>

        <section class="stats-grid" id="stats-grid" aria-label="Görev istatistikleri"></section>

        <section class="panel-card stats-panel">
            <h2>Öncelik dağılımı</h2>
            <div id="stats-priority-list"></div>
        </section>
    </main>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="js/api.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/stats.js"></script>
</body>
</html>
