<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görevler — TaskApi</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="tasks">

    <aside class="sidebar" aria-label="Ana menü">
        <div class="logo">Task<span>Api</span></div>

        <nav class="sidebar-nav">
            <a href="index.html" class="nav-link" data-nav="tasks">
                <span aria-hidden="true">▦</span>
                Görevler
            </a>
            <a href="calendar.html" class="nav-link" data-nav="calendar">
                <span aria-hidden="true">◷</span>
                Takvim
            </a>
            <a href="stats.html" class="nav-link" data-nav="stats">
                <span aria-hidden="true">▥</span>
                İstatistikler
            </a>
            <a href="settings.html" class="nav-link" data-nav="settings">
                <span aria-hidden="true">⚙</span>
                Ayarlar
            </a>
        </nav>

        <div class="sidebar-bottom">
            <a href="#" class="nav-link logout" id="logout-btn">
                <span aria-hidden="true">↪</span>
                Çıkış Yap
            </a>
        </div>
    </aside>

    <div class="modal-overlay" id="task-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
        <div class="task-modal">
            <div class="modal-header">
                <div>
                    <p class="modal-label">GÖREV</p>
                    <h2 id="modal-title">Yeni Görev</h2>
                </div>
                <button type="button" class="modal-close" id="close-modal" aria-label="Pencereyi kapat">×</button>
            </div>

            <form id="task-form" novalidate>
                <div class="form-group">
                    <label for="task-title">Görev başlığı</label>
                    <input type="text" id="task-title" placeholder="Örn. DRF projesini tamamla" maxlength="200" required autocomplete="off">
                    <p id="task-title-error" class="field-error" role="alert"></p>
                </div>

                <div class="form-group">
                    <label for="task-description">Açıklama</label>
                    <textarea id="task-description" placeholder="Görev hakkında kısa bir açıklama..." rows="4"></textarea>
                    <p id="task-description-error" class="field-error" role="alert"></p>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="task-status">Durum</label>
                        <select id="task-status">
                            <option value="todo">Yapılacak</option>
                            <option value="doing">Devam Ediyor</option>
                            <option value="done">Tamamlandı</option>
                        </select>
                        <p id="task-status-error" class="field-error" role="alert"></p>
                    </div>

                    <div class="form-group">
                        <label for="task-priority">Öncelik</label>
                        <select id="task-priority">
                            <option value="low">Düşük</option>
                            <option value="medium" selected>Orta</option>
                            <option value="high">Yüksek</option>
                        </select>
                        <p id="task-priority-error" class="field-error" role="alert"></p>
                    </div>
                </div>

                <div class="form-group">
                    <label for="task-due-date">Son tarih</label>
                    <input type="date" id="task-due-date">
                    <p id="task-due-date-error" class="field-error" role="alert"></p>
                </div>

                <p id="task-form-error" class="form-error" role="alert"></p>

                <div class="modal-actions">
                    <button type="button" class="cancel-btn" id="cancel-task">İptal</button>
                    <button type="submit" class="save-task-btn">Görevi Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <main class="main-content">
        <header class="topbar">
            <div>
                <p id="welcome-message" class="welcome-line">Hoş geldin 👋</p>
                <h1>Görevlerim</h1>
            </div>
            <div class="topbar-actions">
                <button type="button" class="mobile-logout-btn" id="mobile-logout-btn">Çıkış</button>
                <button type="button" class="new-task-btn" id="new-task-btn">
                    <span aria-hidden="true">+</span>
                    Yeni Görev
                </button>
            </div>
        </header>

        <div id="board-status" class="page-status" aria-live="polite"></div>

        <section class="board" id="task-board" aria-label="Görev panosu">
            <div class="column">
                <div class="column-header">
                    <div>
                        <h2>Yapılacak</h2>
                        <span class="task-count" id="todo-count">0</span>
                    </div>
                </div>
                <div class="task-list" id="todo-list" data-status="todo" data-empty-label="Henüz yapılacak görev yok."></div>
            </div>

            <div class="column">
                <div class="column-header">
                    <div>
                        <h2>Devam Ediyor</h2>
                        <span class="task-count" id="doing-count">0</span>
                    </div>
                </div>
                <div class="task-list" id="doing-list" data-status="doing" data-empty-label="Devam eden görev yok."></div>
            </div>

            <div class="column">
                <div class="column-header">
                    <div>
                        <h2>Tamamlandı</h2>
                        <span class="task-count" id="done-count">0</span>
                    </div>
                </div>
                <div class="task-list" id="done-list" data-status="done" data-empty-label="Tamamlanan görev yok."></div>
            </div>
        </section>
    </main>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="js/api.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
