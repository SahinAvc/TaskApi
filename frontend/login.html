<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Giriş Yap - TaskApi</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                Task<span>Api</span>
            </div>

            <h1>Tekrar hoş geldin</h1>

            <p class="auth-description">
                Görevlerini yönetmek için giriş yap.
            </p>


            <form id="login-form">

                <div class="form-group">

                    <label for="username">
                        Kullanıcı adı
                    </label>

                    <input
                        type="text"
                        id="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Şifre
                    </label>

                    <input
                        type="password"
                        id="password"
                        required
                    >

                </div>


                <p
                    id="login-error"
                    class="form-error"
                ></p>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Giriş Yap
                </button>

            </form>


            <p class="auth-footer">
                Hesabın yok mu?
                <a href="register.html">Kayıt Ol</a>
            </p>

        </div>

    </div>


    <script src="js/api.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
